[package]
name = "folio-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
hex = "0.4.3"
jsonwebtoken = "9"
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "compression-gzip", "fs", "request-id", "util", "catch-panic", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
rsa = "0.9.10"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
