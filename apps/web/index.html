<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>folio</title>
    <meta name="description" content="folio, an offline-first notebook for handwriting, diagrams and ideas." />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c21" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- opaque status bar: with the translucent style iOS 26+ blurs the top of the app and overlaps it -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="folio" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- social share card; %VITE_SITE_URL% makes the image URL absolute, which most crawlers require -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="folio" />
    <meta property="og:title" content="folio: handwriting, diagrams and ideas" />
    <meta property="og:description" content="An offline-first notebook for handwriting, diagrams and ideas on an infinite canvas." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The folio wordmark next to a hand-drawn sketch that cleans up into a diagram." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
