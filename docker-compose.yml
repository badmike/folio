# Self-hosted folio: web app + sync/AI server in one container.
# Put the variables in a `.env` file next to this one, then run `docker compose up -d`.
# Terminate TLS in front of it (Caddy, nginx, a platform router): the PWA needs HTTPS.
services:
  folio:
    image: ghcr.io/badmike/folio:${FOLIO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '8989:8989'
    volumes:
      - folio-data:/app/data
    environment:
      # Accounts and sync: sign-in through an OpenID Connect provider (Google: https://accounts.google.com).
      # Set all four, with <FOLIO_PUBLIC_URL>/api/auth/callback as the provider's redirect URI.
      # Leave them empty to run the app local-only.
      FOLIO_PUBLIC_URL: ${FOLIO_PUBLIC_URL:-}
      FOLIO_OIDC_ISSUER: ${FOLIO_OIDC_ISSUER:-}
      FOLIO_OIDC_CLIENT_ID: ${FOLIO_OIDC_CLIENT_ID:-}
      FOLIO_OIDC_CLIENT_SECRET: ${FOLIO_OIDC_CLIENT_SECRET:-}
      # AI chat dock through OpenRouter. Per-user daily limit in USD (default 1.00).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FOLIO_AI_DAILY_CREDIT_USD: ${FOLIO_AI_DAILY_CREDIT_USD:-1.00}
      # Optional S3-compatible storage for snapshots and assets (default: the data volume).
      FOLIO_S3_BUCKET: ${FOLIO_S3_BUCKET:-}
      FOLIO_S3_ENDPOINT: ${FOLIO_S3_ENDPOINT:-}
      FOLIO_S3_REGION: ${FOLIO_S3_REGION:-}
      FOLIO_S3_ACCESS_KEY_ID: ${FOLIO_S3_ACCESS_KEY_ID:-}
      FOLIO_S3_SECRET_ACCESS_KEY: ${FOLIO_S3_SECRET_ACCESS_KEY:-}

volumes:
  folio-data:
